<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #F5F5E8;
  --green-light: #8faf6e;
  --green-dark: #5a7a52;
  --green-glow-light: rgba(143,175,110,0.15);
  --green-glow-dark: rgba(90,122,82,0.12);
  --accent: #A8D400;
  --text-dark: #1a1a1a;
  --text-mid: #555;
  --text-light: #999;
}

html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  font-family: "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  overflow-x: hidden;
}

/* ===================== NAV DOTS ===================== */
.nav-dots {
  position: fixed;
  right: 28px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 100;
}
.nav-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(90,122,82,0.25);
  cursor: pointer;
  transition: all 0.3s ease;
}
.nav-dot.active {
  background: var(--accent);
  transform: scale(1.4);
}

/* ===================== SECTION 2: 图表 ===================== */
#sec-chart {
  width: 100vw; height: 100vh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 顶部标题栏 */
.chart-header {
  padding: 40px 56px 20px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(90,122,82,0.12);
}
.chart-header-title {
  font-size: clamp(22px, 2.6vw, 36px);
  font-weight: 900;
  color: var(--text-dark);
  line-height: 1.2;
}
.chart-header-sub {
  font-size: 13px;
  color: var(--text-light);
  margin-top: 6px;
  letter-spacing: 0.05em;
}

/* 主体区域 */
.chart-body {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* 左侧图表 */
.chart-left {
  flex: 0 0 64%;
  position: relative;
  background: #EEEDE0;
  display: flex; align-items:center; justify-content:center;
  padding: 32px 40px;
}
#chart-svg { width:100%; height:100%; }

/* 图表说明 */
.chart-insight {
  position: absolute;
  bottom: 28px; left: 40px; right: 40px;
  font-size: 13px;
  color: var(--text-mid);
  line-height: 1.75;
  border-left: 2px solid var(--accent);
  padding-left: 12px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.chart-insight.vis { opacity:1; transform:translateY(0); }

/* 右侧标签 */
.chart-right {
  flex: 0 0 36%;
  background: var(--bg);
  border-left: 1px solid rgba(90,122,82,0.1);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 32px 36px;
  gap: 10px;
}

.dim-tab {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 18px;
  border-radius: 40px;
  cursor: pointer;
  border: 1.5px solid transparent;
  background: transparent;
  transition: all 0.25s ease;
  user-select: none;
}
.dim-tab:hover {
  background: rgba(143,175,110,0.08);
  transform: translateX(4px);
}
.dim-tab.active {
  background: rgba(143,175,110,0.12);
  border-color: var(--green-light);
  transform: translateX(8px);
}

.dim-num {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: rgba(90,122,82,0.1);
  display: flex; align-items:center; justify-content:center;
  font-size: 11px; font-weight: 700;
  color: var(--text-light);
  flex-shrink: 0;
  margin-top: 2px;
  transition: all 0.25s;
}
.dim-tab.active .dim-num {
  background: var(--accent);
  color: #fff;
}
.dim-label {
  font-size: 14px; font-weight: 700;
  color: var(--text-dark);
  line-height: 1.35;
}
.dim-sub {
  font-size: 11px; color: var(--text-light);
  margin-top: 3px; line-height: 1.4;
}

/* chart transition */
.chart-left.fading { opacity: 0; transition: opacity 0.2s; }
.chart-left { transition: opacity 0.35s; }

/* ===================== SVG 动画 CSS ===================== */
.branch {
  fill: none;
  stroke: #7a6040;
  stroke-linecap: round;
  transform-origin: center bottom;
}
.trunk { stroke-width: 6; }
.branch-main { stroke-width: 3.5; }
.branch-sub { stroke-width: 2; }

@keyframes sway1 {
  0%,100% { transform: rotate(0deg); }
  50% { transform: rotate(1.5deg); }
}
@keyframes sway2 {
  0%,100% { transform: rotate(0deg); }
  50% { transform: rotate(-2deg); }
}
@keyframes sway3 {
  0%,100% { transform: rotate(0deg); }
  50% { transform: rotate(1deg); }
}
.sway1 { animation: sway1 5s ease-in-out infinite; transform-origin: 50% 100%; }
.sway2 { animation: sway2 6.5s ease-in-out infinite; transform-origin: 50% 100%; }
.sway3 { animation: sway3 4.5s ease-in-out infinite; transform-origin: 50% 100%; }
</style>
</head>

function scrollToSec(i) {
  const secs = ['sec-chart'];
  document.getElementById(secs[i]).scrollIntoView({behavior:'smooth'});
}

// Nav dots
const dots = document.querySelectorAll('.nav-dot');
const secs = document.querySelectorAll('section');
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const idx = [...secs].indexOf(e.target);
      dots.forEach((d,i) => d.classList.toggle('active', i===idx));
    }
  });
}, {threshold: 0.5});
secs.forEach(s => io.observe(s));

let curDim = 'age';

function getChartSize() {
  const el = document.getElementById('chartLeft');
  return { W: el.offsetWidth - 80, H: el.offsetHeight - 100 };
}

function switchDim(el, dim) {
  if (dim === curDim) return;
  curDim = dim;
  document.querySelectorAll('.dim-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const ins = document.getElementById('chartInsight');
  ins.classList.remove('vis');
  const left = document.getElementById('chartLeft');
  left.style.opacity = '0';
  setTimeout(() => {
    DIMS[dim].draw(true);
    left.style.opacity = '1';
    setTimeout(() => {
      ins.textContent = DIMS[dim].insight;
      ins.classList.add('vis');
    }, 400);
  }, 200);
}

function countBy(key, vals) {
  const c = {}; vals.forEach(v => c[v]=0);
  NOMAD_DATA.forEach(d => { let v=d[key]; if(v in c) c[v]++; });
  return vals.map(v=>({label:v, count:c[v], pct:(c[v]/NOMAD_DATA.length*100).toFixed(1)}));
}

    {x:W*0.18, y:H*0.6},
    {x:W*0.42, y:H*0.55},
    {x:W*0.7,  y:H*0.42},
    {x:W*0.88, y:H*0.65},
  ];

  const g = svg.append('g').attr('transform','translate(40,40)');
  data.forEach((d,i) => {
    const r = maxR * (d.pct/71.28);
    const pos = positions[i];
    const circ = g.append('circle')
      .attr('cx', pos.x).attr('cy', pos.y)
      .attr('r', anim ? 0 : r)
      .attr('fill', d.color).attr('opacity', 0.75);
    if(anim) circ.transition().duration(700).delay(i*120).ease(d3.easeBackOut)
      .attr('r', r);

    g.append('text').attr('x',pos.x).attr('y',pos.y-4)
      .attr('text-anchor','middle').attr('font-size',14).attr('font-weight',700)
      .attr('fill','#fff').attr('opacity', anim?0:1)
      .text(d.label)
      .transition().delay(i*120+400).duration(300).attr('opacity',1);

    g.append('text').attr('x',pos.x).attr('y',pos.y+16)
      .attr('text-anchor','middle').attr('font-size',12)
      .attr('fill','rgba(255,255,255,0.85)').attr('opacity', anim?0:1)
      .text(d.pct+'%')
      .transition().delay(i*120+400).duration(300).attr('opacity',1);
  });

  // label: 平均31岁
  g.append('text').attr('x',W*0.5).attr('y',H+56)
    .attr('text-anchor','middle').attr('font-size',13)
    .attr('fill','#888')
    .text('平均年龄约 31 岁 · 国内比海外年轻约 4 岁');
}

// --- CHART 2: Gender isotype ---
function drawGender(anim) {
  const svg = d3.select('#chart-svg');
  svg.selectAll('*').remove();
  const {W,H} = getChartSize();
  svg.attr('viewBox',`0 0 ${W+80} ${H+100}`);
  const g = svg.append('g').attr('transform','translate(40,30)');

  const groups = [
    { label:'中国数字游民', male:51.77, female:46.10, other:2.13 },
    { label:'海外数字游民', male:82, female:18, other:0 },
  ];
  const iconR = 10;
  const cols = 10;
  const gw = W/2 - 20;

  groups.forEach((grp, gi) => {
    const ox = gi * (gw + 40);
    g.append('text').attr('x', ox+gw/2).attr('y', 18)
      .attr('text-anchor','middle').attr('font-size',13).attr('font-weight',700)
      .attr('fill','#444').text(grp.label);

    // draw figures
    const total = 50;
    const maleCount = Math.round(grp.male/100*total);
    for(let i=0;i<total;i++){
      const col = i%cols, row = Math.floor(i/cols);
      const cx = ox + col*(iconR*2.4) + iconR;
      const cy = 36 + row*(iconR*3) + iconR;
      const isMale = i < maleCount;
      const color = isMale ? '#7b9fe8' : '#e87bb0';
      const el = g.append('g').attr('opacity', anim?0:1);
      // body
      el.append('circle').attr('cx',cx).attr('cy',cy-iconR*0.2).attr('r',iconR*0.42).attr('fill',color);
      el.append('rect').attr('x',cx-iconR*0.35).attr('y',cy+iconR*0.25).attr('width',iconR*0.7).attr('height',iconR*0.9).attr('rx',2).attr('fill',color);
      if(anim) el.transition().delay(i*18+200).duration(250).attr('opacity',1);
    }

    // pct text
    g.append('text').attr('x',ox+gw/2).attr('y',H-10)
      .attr('text-anchor','middle').attr('font-size',12).attr('fill','#7b9fe8')
      .text(`男 ${grp.male}%`);
    g.append('text').attr('x',ox+gw/2).attr('y',H+8)
      .attr('text-anchor','middle').attr('font-size',12).attr('fill','#e87bb0')
      .text(`女 ${grp.female}%`);
  });
}

// --- CHART 3: Education bar ---
function drawEdu(anim) {
  const svg = d3.select('#chart-svg');
  svg.selectAll('*').remove();
  const {W,H} = getChartSize();
  svg.attr('viewBox',`0 0 ${W+80} ${H+100}`);
  const g = svg.append('g').attr('transform','translate(120,40)');

  const data = [
    {label:'大专及以下', pct:13.48, color:'#c5c5a0'},
    {label:'本科',       pct:61.34, color:'#a8c870'},
    {label:'硕士',       pct:23.76, color:'#8faf6e'},
    {label:'博士',       pct:1.42,  color:'#5a7a52'},
  ];
  const bH = Math.min(42, H/data.length - 14);
  const yStep = H / data.length;
  const xScale = d3.scaleLinear().domain([0,65]).range([0,W-120]);

  data.forEach((d,i) => {
    const y = i*yStep + (yStep-bH)/2;
    g.append('rect').attr('x',0).attr('y',y).attr('width',W-120).attr('height',bH)
      .attr('rx',bH/2).attr('fill','rgba(0,0,0,0.04)');
    g.append('text').attr('x',-10).attr('y',y+bH/2+5)
      .attr('text-anchor','end').attr('font-size',13).attr('fill','#555')
      .text(d.label);
    const tw = xScale(d.pct);
    const bar = g.append('rect').attr('x',0).attr('y',y)
      .attr('width', anim?0:tw).attr('height',bH)
      .attr('rx',bH/2).attr('fill',d.color).attr('opacity',0.85);
    if(anim) bar.transition().duration(650).delay(i*100).ease(d3.easeCubicOut).attr('width',tw);
    g.append('text').attr('x', tw+8).attr('y',y+bH/2+5)
      .attr('font-size',13).attr('font-weight',700).attr('fill','#444')
      .attr('opacity',anim?0:1).text(d.pct+'%')
      .transition().delay(i*100+500).duration(250).attr('opacity',1).attr('x',tw+8);
  });
}

// --- CHART 4: MBTI petal ---
function drawMbti(anim) {
  const svg = d3.select('#chart-svg');
  svg.selectAll('*').remove();
  const {W,H} = getChartSize();
  svg.attr('viewBox',`0 0 ${W+80} ${H+100}`);
  const g = svg.append('g').attr('transform',`translate(${(W+80)/2},${(H+60)/2})`);

  const data = [
    {label:'INFP',pct:18.78},{label:'ENFP',pct:16.24},{label:'INTP',pct:12.69},
    {label:'INFJ',pct:10.66},{label:'INTJ',pct:10.15},{label:'ENFJ',pct:7.61},
    {label:'ENTJ',pct:6.09},{label:'ENTP',pct:5.08},{label:'ESFJ',pct:3.05},
    {label:'ISFP',pct:2.03},{label:'ESTJ',pct:2.03},{label:'ISFJ',pct:1.52},
    {label:'ISTJ',pct:1.02},{label:'ISTP',pct:1.02},{label:'ESTP',pct:1.02},
    {label:'ESFP',pct:1.02},
  ];
  const maxR = Math.min(W,H)*0.36;
  const angleStep = (Math.PI*2)/data.length;
  const colorScale = d3.scaleSequential(d3.interpolate('#c8d8a0','#5a7a52'))
    .domain([0, data.length-1]);

  data.forEach((d,i) => {
    const angle = i*angleStep - Math.PI/2;
    const r = maxR * (d.pct/18.78);
    // petal path
    const x1 = Math.cos(angle-0.18)*r*0.35;
    const y1 = Math.sin(angle-0.18)*r*0.35;
    const x2 = Math.cos(angle)*r;
    const y2 = Math.sin(angle)*r;
    const x3 = Math.cos(angle+0.18)*r*0.35;
    const y3 = Math.sin(angle+0.18)*r*0.35;

    const petal = g.append('path')
      .attr('d',`M0,0 Q${x1},${y1} ${x2},${y2} Q${x3},${y3} 0,0 Z`)
      .attr('fill', colorScale(i))
      .attr('opacity', anim?0:0.8)
      .attr('stroke','white').attr('stroke-width',0.8);
    if(anim) petal.transition().duration(500).delay(i*50).attr('opacity',0.8);

    // label for big ones
    if(d.pct>5) {
      const lx = Math.cos(angle)*(r+18);
      const ly = Math.sin(angle)*(r+18);
      g.append('text').attr('x',lx).attr('y',ly+4)
        .attr('text-anchor','middle').attr('font-size',11).attr('fill','#444')
        .text(d.label);
    }
  });

  // center
  g.append('circle').attr('r',22).attr('fill','white').attr('stroke','#c8d8a0').attr('stroke-width',1.5);
  g.append('text').attr('y',4).attr('text-anchor','middle').attr('font-size',10).attr('fill','#666').text('MBTI');
}

// --- CHART 5: Experience half-donut ---
function drawExp(anim) {
  const svg = d3.select('#chart-svg');
  svg.selectAll('*').remove();
  const {W,H} = getChartSize();
  svg.attr('viewBox',`0 0 ${W+80} ${H+100}`);

  const data = [
    {label:'不到一年', pct:7.45,  color:'#d4f073'},
    {label:'一到三年', pct:17.38, color:'#b8d840'},
    {label:'三到五年', pct:19.86, color:'#8faf6e'},
    {label:'五年及以上',pct:55.31,color:'#5a7a52'},
  ];

  const cx=(W+80)/2, cy=H*0.55+50;
  const outerR=Math.min(W,H)*0.33, innerR=outerR*0.52;
  const g=svg.append('g');

  const pie=d3.pie().value(d=>d.pct).sort(null);
  const arc=d3.arc().outerRadius(outerR).innerRadius(innerR);
  const arcs=pie(data);

  arcs.forEach((a,i)=>{
    const path=g.append('path')
      .attr('transform',`translate(${cx},${cy})`)
      .attr('fill',a.data.color).attr('opacity',0.88)
      .attr('stroke','white').attr('stroke-width',2);
    if(anim){
      path.attr('d',d3.arc().outerRadius(0).innerRadius(0)(a))
        .transition().duration(600).delay(i*100).ease(d3.easeBackOut.overshoot(0.8))
        .attrTween('d', function(){
          const interp=d3.interpolate({startAngle:a.startAngle,endAngle:a.startAngle},a);
          return t=>arc(interp(t));
        }).attr('d',arc(a));
    } else { path.attr('d',arc(a)); }

    // label
    const [lx,ly]=arc.centroid(a);
    g.append('text')
      .attr('transform',`translate(${cx+lx},${cy+ly})`)
      .attr('text-anchor','middle').attr('font-size',11).attr('fill','white').attr('font-weight',600)
      .attr('opacity',anim?0:1).text(a.data.pct+'%')
      .transition().delay(i*100+500).duration(250).attr('opacity',1);
  });

  // legend
  data.forEach((d,i)=>{
    const lx=cx-outerR-10+(i%2)*(outerR+40);
    const ly=cy+outerR+28+Math.floor(i/2)*20;
    g.append('rect').attr('x',lx-8).attr('y',ly-8).attr('width',10).attr('height',10)
      .attr('rx',2).attr('fill',d.color);
    g.append('text').attr('x',lx+6).attr('y',ly).attr('font-size',11).attr('fill','#555')
      .text(d.label+' '+d.pct+'%');
  });

  // center text
  g.append('text').attr('x',cx).attr('y',cy-8)
    .attr('text-anchor','middle').attr('font-size',15).attr('font-weight',900).attr('fill','#5a7a52')
    .text('55.31%');
  g.append('text').attr('x',cx).attr('y',cy+10)
    .attr('text-anchor','middle').attr('font-size',11).attr('fill','#888')
    .text('五年及以上');
}

<script>
/* ===== 跨章节滚动切换（由外层合并页面注入，不影响本章节原有内容/动画） ===== */
(function(){
  var cooldown = false;
  function notifyParent(dir){
    if(cooldown) return;
    cooldown = true;
    try{ window.parent.postMessage({source:'daocao-page', dir:dir}, '*'); }catch(e){}
    setTimeout(function(){ cooldown = false; }, 900);
  }
  function scroller(){ return document.scrollingElement || document.documentElement; }
  function isScrollable(){ return scroller().scrollHeight > window.innerHeight + 2; }
  function atTop(){ return scroller().scrollTop <= 1; }
  function atBottom(){ return scroller().scrollTop + window.innerHeight >= scroller().scrollHeight - 1; }

  window.addEventListener('wheel', function(e){
    if(!isScrollable()){
      notifyParent(e.deltaY > 0 ? 'next' : 'prev');
      return;
    }
    if(e.deltaY > 0 && atBottom()) notifyParent('next');
    else if(e.deltaY < 0 && atTop()) notifyParent('prev');
  }, {passive:true});

  var touchStartY = null;
  window.addEventListener('touchstart', function(e){
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  window.addEventListener('touchend', function(e){
    if(touchStartY === null) return;
    var dy = touchStartY - e.changedTouches[0].clientY;
    touchStartY = null;
    if(Math.abs(dy) < 40) return;
    if(!isScrollable()){
      notifyParent(dy > 0 ? 'next' : 'prev');
      return;
    }
    if(dy > 0 && atBottom()) notifyParent('next');
    else if(dy < 0 && atTop()) notifyParent('prev');
  }, {passive:true});
})();
</script>
